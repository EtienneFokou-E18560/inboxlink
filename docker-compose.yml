services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: inboxlink
      POSTGRES_PASSWORD: inboxlink
      POSTGRES_DB: inboxlink
    ports:
      - "5432:5432"
    volumes:
      - inboxlink_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inboxlink -d inboxlink"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  inboxlink_pg:
