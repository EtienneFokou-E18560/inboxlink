name: Strip attribution

# Removes Claude Code and Cursor attribution from pull request descriptions:
# "Generated by/with Claude Code" or "Cursor" footers, claude.ai/code session
# links, cursor.com links (Open in Cursor / Open in Web badges), Cursor
# Bugbot summary blocks, and Co-Authored-By: Claude / Cursor trailers. Edits made with GITHUB_TOKEN do not trigger workflows, so this
# never loops. No code is checked out. Plain pull_request (not _target) so a PR
# that changes this file runs its own copy; PRs here come from this repo's own
# branches, so the token can write.

on:
  pull_request:
    types: [opened, edited, reopened]

permissions:
  pull-requests: write

jobs:
  strip:
    name: Remove attribution from description
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Clean description
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          body=$(gh api "repos/$REPO/pulls/$PR" --jq '.body // ""')
          clean=$(printf '%s' "$body" | perl -0pe '
            s/<!-- CURSOR_SUMMARY -->.*?<!-- \/CURSOR_SUMMARY -->//sg;
            s/(?:\R[ \t]*)*-{3,}[ \t]*(?:\R[ \t]*)+_?Generated (?:by|with) \[?(?:Claude Code|Cursor)\b[^\n]*//g;
            s/^.*Generated (?:by|with) \[?(?:Claude Code|Cursor)\b.*(?:\R|\z)//mg;
            s/^.*claude\.ai\/code.*(?:\R|\z)//mg;
            s/^.*cursor\.(?:com|sh)\b.*(?:\R|\z)//mgi;
            s/^Co-Authored-By: (?:Claude|Cursor).*(?:\R|\z)//mgi;
            s/^Co-Authored-By: .*cursoragent.*(?:\R|\z)//mgi;
            s/\s+\z//;
          ')
          if [ "$clean" = "$body" ]; then
            echo "Description is clean."
            exit 0
          fi
          gh api -X PATCH "repos/$REPO/pulls/$PR" -f body="$clean" --silent
          echo "Removed attribution from #$PR."
