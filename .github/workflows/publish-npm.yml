# Manual / opt-in publish for @inboxlink/core and @inboxlink/sdk.
# Never runs on push or pull_request. Default is dry-run (no registry write).
# Real publishes use npm Trusted Publishing (OIDC): GitHub proves its identity to npm for
# each run, so there is no token to create, rotate or leak. A repository NPM_TOKEN secret
# is only an optional fallback.
#
# Provenance: npm attestations require a *public* GitHub source repository.
# This workflow enables --provenance only when github.repository_visibility
# is "public". While the repo is private/internal, publishes omit provenance
# (package.json must not set publishConfig.provenance: true — that flag
# overrides NPM_CONFIG_PROVENANCE and fails private-repo publishes).
# Making the GitHub repository public automatically re-enables provenance.
# Long-term recommendation for MIT OSS: make the repo public for provenance trust.
#
# Setup (one-time, on npmjs.com, for BOTH @inboxlink/core and @inboxlink/sdk):
#   package -> Settings -> Trusted Publisher -> GitHub Actions
#     Organization or user: EtienneFokou-E18560   Repository: inboxlink
#     Workflow filename:    publish-npm.yml        Environment: (leave empty)
# See docs/publishing.md. No GitHub secret is needed.
#
name: Publish npm packages

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Pack and dry-run only (no registry write)
        type: boolean
        default: true
      package:
        description: Which package(s) to publish
        type: choice
        options:
          - both
          - core
          - sdk
        default: both
      tag:
        description: npm dist-tag (usually latest)
        type: string
        default: latest

permissions:
  contents: read
  # Required for npm provenance when the source repository is public.
  id-token: write

concurrency:
  group: publish-npm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"

      # Trusted Publishing needs npm >= 11.5.1; Node 22 ships an older npm.
      - name: Use a current npm
        run: |
          npm install -g npm@^11.5.1
          npm --version

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm --filter @inboxlink/core --filter @inboxlink/sdk run build

      - name: Test SDK
        run: pnpm --filter @inboxlink/sdk test

      - name: Publish packages
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          PACKAGE: ${{ inputs.package }}
          NPM_TAG: ${{ inputs.tag }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # public → provenance on; private/internal → provenance off (auto).
          REPO_VISIBILITY: ${{ github.repository_visibility }}
        run: |
          set -euo pipefail

          # No NPM_TOKEN is required: with none set, npm authenticates through GitHub's OIDC
          # identity (Trusted Publishing) and fails closed if no trusted publisher is configured.
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            unset NODE_AUTH_TOKEN
            echo "No NPM_TOKEN set: publishing with npm Trusted Publishing (OIDC)."
          else
            echo "NPM_TOKEN set: using it instead of OIDC."
          fi

          # Do not set publishConfig.provenance in package.json while relying on
          # NPM_CONFIG_PROVENANCE alone — package.json provenance:true wins and
          # breaks private-repo publishes.
          PROVENANCE_FLAG=""
          if [ "${REPO_VISIBILITY}" = "public" ]; then
            echo "Public source repository: enabling npm provenance."
            export NPM_CONFIG_PROVENANCE=true
            PROVENANCE_FLAG="--provenance"
          else
            echo "Source repository visibility is \"${REPO_VISIBILITY}\" (not public)."
            echo "Publishing without provenance. Make the GitHub repo public to re-enable it."
            export NPM_CONFIG_PROVENANCE=false
          fi

          publish_one() {
            local filter="$1"
            local name version
            name=$(pnpm --filter "$filter" exec node -p "require('./package.json').name")
            version=$(pnpm --filter "$filter" exec node -p "require('./package.json').version")
            echo "::group::${filter} (${name}@${version}, dry_run=${DRY_RUN}, provenance=${NPM_CONFIG_PROVENANCE})"
            # Allow retries after a partial publish (e.g. core landed, sdk still missing).
            if [ "${DRY_RUN}" != "true" ] && npm view "${name}@${version}" version >/dev/null 2>&1; then
              echo "Already on registry: ${name}@${version} — skipping"
              echo "::endgroup::"
              return 0
            fi
            # pnpm pack rewrites workspace:* to the real version; npm then does the upload, which
            # is the client that supports Trusted Publishing.
            local dest tarball
            dest="$(mktemp -d)"
            pnpm --filter "$filter" pack --pack-destination "$dest" >/dev/null
            tarball="$(ls "$dest"/*.tgz)"
            echo "Packed $(basename "$tarball")"
            # shellcheck disable=SC2086 # intentional optional --provenance flag
            if [ "${DRY_RUN}" = "true" ]; then
              npm publish "$tarball" --dry-run --access public --tag "$NPM_TAG" ${PROVENANCE_FLAG}
            else
              npm publish "$tarball" --access public --tag "$NPM_TAG" ${PROVENANCE_FLAG}
            fi
            echo "::endgroup::"
          }

          case "${PACKAGE}" in
            core)
              publish_one "@inboxlink/core"
              ;;
            sdk)
              # core at the matching version must already be on the registry
              # (workspace:* rewrites to that version on publish).
              publish_one "@inboxlink/sdk"
              ;;
            both)
              # Publish core first so the rewritten workspace dependency resolves on npm.
              publish_one "@inboxlink/core"
              publish_one "@inboxlink/sdk"
              ;;
            *)
              echo "Unknown package selection: ${PACKAGE}" >&2
              exit 1
              ;;
          esac
