# Manual / opt-in publish for @inboxlink/core and @inboxlink/sdk.
# Never runs on push or pull_request. Default is dry-run (no registry write).
# Real publish needs dry_run=false plus npm Trusted Publishing (OIDC) for this
# workflow filename, or a granular NPM_TOKEN secret. Prefer OIDC; do not commit tokens.
#
# Setup (one-time, before first real publish):
# 1. Create empty packages on npmjs.com (or first publish with a classic token once).
# 2. Add Trusted Publisher: GitHub Actions → repo EtienneFokou-E18560/inboxlink →
#    workflow filename publish-npm.yml
# 3. Optionally add GitHub Environment "npm-publish" with required reviewers.
# 4. Optionally set secret NPM_TOKEN as fallback (stage-only preferred over write).
name: Publish npm packages

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Pack and dry-run only (no registry write)
        type: boolean
        default: true
      package:
        description: Which package(s) to publish
        type: choice
        options:
          - both
          - core
          - sdk
        default: both
      tag:
        description: npm dist-tag (usually latest)
        type: string
        default: latest

permissions:
  contents: read
  # Required for npm Trusted Publishing (OIDC). Harmless for dry-run / token fallback.
  id-token: write

concurrency:
  group: publish-npm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm --filter @inboxlink/core --filter @inboxlink/sdk run build

      - name: Test SDK
        run: pnpm --filter @inboxlink/sdk test

      - name: Ensure npm CLI supports trusted publishing
        run: npm install -g npm@11.5.1

      - name: Configure token fallback (optional)
        if: ${{ inputs.dry_run == false }}
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${NPM_TOKEN:-}" ]; then
            echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" >> "$HOME/.npmrc"
            echo "Configured NPM_TOKEN for publish fallback."
          else
            echo "No NPM_TOKEN secret. Relying on npm Trusted Publishing (OIDC)."
            echo "If OIDC is not configured on npmjs.com for publish-npm.yml, this job will fail closed."
          fi

      - name: Publish packages
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          PACKAGE: ${{ inputs.package }}
          NPM_TAG: ${{ inputs.tag }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail

          publish_one() {
            local filter="$1"
            echo "::group::${filter} (dry_run=${DRY_RUN})"
            if [ "${DRY_RUN}" = "true" ]; then
              pnpm --filter "$filter" exec npm pack --dry-run
              pnpm --filter "$filter" publish --dry-run --access public --no-git-checks --tag "$NPM_TAG"
            else
              pnpm --filter "$filter" publish --access public --no-git-checks --tag "$NPM_TAG"
            fi
            echo "::endgroup::"
          }

          case "${PACKAGE}" in
            core)
              publish_one "@inboxlink/core"
              ;;
            sdk|both)
              # Publish core first so the rewritten workspace dependency resolves on npm.
              publish_one "@inboxlink/core"
              publish_one "@inboxlink/sdk"
              ;;
            *)
              echo "Unknown package selection: ${PACKAGE}" >&2
              exit 1
              ;;
          esac
