# Code scanning for JavaScript/TypeScript.
#
# Etienne (repo admin): enable Code scanning so SARIF upload succeeds:
#   Settings → Security → Code scanning → Set up / Enable
# Private repos may need GitHub Advanced Security; making the repo public
# enables free Code scanning and also npm provenance (see docs/publishing.md).
#
# Also enable Dependabot alerts / security updates and Private Vulnerability
# Reporting under Settings → Security.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Mondays 06:17 UTC — off-peak, slightly jittered
    - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          languages: javascript-typescript
          build-mode: none

      # Analysis itself is fine without Code scanning; SARIF upload fails when
      # the feature is not enabled. Soft-fail so SECURITY.md / Dependabot can
      # merge; once Etienne enables Code scanning, the same workflow uploads.
      - name: Perform CodeQL Analysis
        id: analyze
        continue-on-error: true
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          category: "/language:javascript-typescript"

      - name: Report Code scanning gate
        run: |
          if [ "${{ steps.analyze.outcome }}" = "failure" ]; then
            echo "::warning::CodeQL analyze/upload did not succeed. Common cause on this private repo: Code scanning is not enabled (or GHAS not available)."
            echo "Etienne: Settings → Security → Code scanning → enable Advanced setup for this workflow,"
            echo "or make the repository public (also unlocks free Code scanning + npm provenance)."
            echo "Re-run after enabling; permissions already include security-events: write."
          else
            echo "CodeQL analysis and upload succeeded."
          fi
